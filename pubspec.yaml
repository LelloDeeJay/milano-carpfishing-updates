name: milano_carpfishing_303_asd
description: "App ufficiale La Nuova Milano Carpfishing A.S.D. - Sede 303 CFI"
publish_to: "none"
version: 1.0.16+16

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  qr_flutter: ^4.1.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  table_calendar: ^3.1.3
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  http: ^1.2.2
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo_cfi.png"
